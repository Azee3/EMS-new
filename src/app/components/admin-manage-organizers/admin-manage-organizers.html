<div class="container mt-4">
  <h3>Manage Organizers</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input class="form-control" formControlName="fullName" />
    </div>
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input class="form-control" formControlName="email" />
    </div>
    <div class="mb-3">
      <label class="form-label">Phone Number</label>
      <input class="form-control" formControlName="phone" />
    </div>
    <div class="mb-3">
      <label class="form-label">Organization Name</label>
      <input class="form-control" formControlName="organizationName" />
    </div>

    <button class="btn btn-primary" type="submit">Create Organizer</button>
  </form>

  <div *ngIf="message" class="alert alert-success mt-3">{{ message }}</div>
  <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>

  <h4 class="mt-4">Existing Organizers</h4>
  <ul class="list-group">
    <li *ngFor="let o of organizers" class="list-group-item d-flex justify-content-between align-items-start">
      <div>
        <strong>{{ o.fullName }}</strong> — {{ o.email }} <br />
        <small>{{ o.phone }}</small>
      </div>
      <div>
        <a class="btn btn-sm btn-secondary me-2" [routerLink]="['/admin/organizers', o.id]">Details</a>
        <button class="btn btn-sm btn-danger" (click)="deleteOrganizer(o.id)">Delete</button>
      </div>
    </li>
  </ul>
</div>

<div class="responsive-seat-map">
  <h3>Click on a section to select seats</h3>
  <div class="map-container">
    <img src="https://shantanand-adt.org/wp-content/uploads/2025/11/SEATING-NUMBERING-SHEET-scaled-1.jpg" alt="Seating Chart" class="responsive-map-image">
    
    <!-- Clickable overlay sections -->
    <div class="section-overlay vip-section" (click)="onSectionClick('VIP')">
      <span>VIP</span>
    </div>
    <div class="section-overlay left-section" (click)="onSectionClick('LEFT')">
      <span>Left Orchestra</span>
    </div>
    <div class="section-overlay right-section" (click)="onSectionClick('RIGHT')">
      <span>Right Orchestra</span>
    </div>
    <div class="section-overlay center-section" (click)="onSectionClick('CENTER')">
      <span>Center</span>
    </div>
    <div class="section-overlay left-balcony" (click)="onSectionClick('LEFT_BALCONY')">
      <span>Left Balcony</span>
    </div>
    <div class="section-overlay right-balcony" (click)="onSectionClick('RIGHT_BALCONY')">
      <span>Right Balcony</span>
    </div>
  </div>
</div>
